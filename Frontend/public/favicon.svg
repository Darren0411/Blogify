<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Light background rounded square -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="#F5F5F5"/>
  
  <!-- Pen icon -->
  <g transform="translate(100, 100)">
    <!-- Pen nib (triangular tip) -->
    <path d="M -2 20 L 8 -8 L -8 -8 Z" fill="#1a1a1a"/>
    
    <!-- Pen barrel -->
    <rect x="-6" y="-25" width="12" height="45" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    
    <!-- Pen clip -->
    <ellipse cx="0" cy="-20" rx="8" ry="3" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  </g>
</svg>